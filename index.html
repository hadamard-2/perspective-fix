<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PerspectiveFix – Straighten Tilted Image & Document Online for Free</title>

    <link rel="apple-touch-icon" sizes="180x180" href="favicon-512.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="main">
        <div id="uploadZone" class="upload-zone" role="button" tabindex="0"
            aria-label="Upload image for perspective correction">
            <input type="file" id="fileInput" accept="image/*" class="hidden" aria-label="Choose image file">
            <div class="upload-icon">
                <span class="icon icon-upload-cloud"></span>
            </div>
            <h3>Drop your image here or click to upload</h3>
            <p>Supports JPG, PNG, WebP • Paste from clipboard (Ctrl+V)</p>
            <div id="errorMsg" class="error-msg hidden" role="alert"></div>
        </div>

        <section id="editor" class="editor" aria-label="Image perspective correction editor">
            <div class="toolbar">
                <div class="btn-group">
                    <button id="newBtn" class="btn btn-sec" type="button" aria-label="Upload new image">
                        <span class="icon icon-new-image"></span>
                        <span class="btn-text">New</span>
                    </button>
                    <button id="addCropBtn" class="btn btn-sec" type="button" title="Add another crop (A)"
                        aria-label="Add another crop region">
                        <span class="icon icon-new-image"></span>
                        <span class="btn-text">Add crop</span>
                    </button>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <button id="downloadBtn" class="btn btn-pri" type="button" title="Crop and download image (Ctrl+S)"
                        aria-label="Crop and download image">
                        <span id="downloadIcon" class="icon icon-download"></span>
                        <span id="downloadText" class="btn-text">Crop</span>
                    </button>
                </div>
            </div>

            <div id="cropTabs" class="crop-tabs" role="tablist" aria-label="Crop regions"></div>

            <div class="editor-stack">
                <div class="panel panel-edit" id="editPanel">
                    <div class="panel-header">
                        <div class="panel-title">
                            <span id="origFileName"></span>
                        </div>
                        <div class="panel-actions">
                            <span id="origDim" class="dim-badge" aria-label="Original image dimensions">—</span>
                            <button id="fullscreenBtn" class="icon-btn" type="button" title="Full screen (F)"
                                aria-label="Toggle full screen edit view">
                                <span class="icon icon-fullscreen"></span>
                                <span class="icon icon-fullscreen-exit"></span>
                            </button>
                        </div>
                    </div>
                    <div class="panel-body" id="origContainer">
                        <div class="canvas-wrap" id="canvasWrap">
                            <canvas id="srcCanvas" aria-label="Original image with perspective selection"></canvas>
                            <svg id="quadSvg" class="quad-svg" aria-hidden="true"></svg>
                            <div id="corners" aria-label="Draggable corner handles"></div>
                        </div>
                    </div>
                    <div id="zoomLens" class="zoom-lens" aria-hidden="true"></div>
                </div>

                <div class="panel panel-results">
                    <div class="panel-header">
                        <div class="panel-title">
                            <span class="icon icon-checkmark"></span>
                            <span>Fixed – Ready to download</span>
                        </div>
                    </div>
                    <div class="panel-body results-body">
                        <div id="previewCards" class="preview-cards" aria-label="Corrected results per crop"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
